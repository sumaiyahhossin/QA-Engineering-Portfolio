name: Humana Selenium Tests

on:
  workflow_dispatch:
    inputs:
      confirm_authorized_test_environment:
        description: "Confirm the test URLs point to an environment you are authorized to automate (not a public production site)."
        required: true
        type: boolean
        default: false

jobs:
  selenium-tests:
    if: inputs.confirm_authorized_test_environment == true
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Humana/Selenium-Automation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Selenium tests
        run: mvn -B clean test
