name: Humana Selenium Tests

on:
  push:
    branches: [main]
    paths:
      - 'Humana/Selenium-Automation/**'
      - '.github/workflows/humana-selenium.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Humana/Selenium-Automation/**'
      - '.github/workflows/humana-selenium.yml'
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Humana/Selenium-Automation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Selenium tests
        run: mvn -B clean test