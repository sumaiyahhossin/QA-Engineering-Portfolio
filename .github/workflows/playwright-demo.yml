name: Playwright Portfolio Demo

on:
  push:
    branches: [main]
    paths:
      - 'Portfolio-Practice/Playwright-Demo/**'
      - '.github/workflows/playwright-demo.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Portfolio-Practice/Playwright-Demo/**'
      - '.github/workflows/playwright-demo.yml'
  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Portfolio-Practice/Playwright-Demo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: Portfolio-Practice/Playwright-Demo/playwright-report/
          if-no-files-found: ignore
          retention-days: 7